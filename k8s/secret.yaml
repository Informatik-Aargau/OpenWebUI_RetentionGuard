apiVersion: v1
kind: Secret
metadata:
  name: aargaugpt-retentionguard-env-${ENVIRONMENT}
  namespace: ${K8S_NAMESPACE}
  labels:
    app: aargaugpt-retentionguard
    environment: ${ENVIRONMENT}
type: Opaque
data:
  # This will be populated by the CI/CD pipeline from B64_DOTENV variable
  # The .env file content is base64 encoded and stored in GitLab CI/CD variables
  .env: ${B64_DOTENV}
